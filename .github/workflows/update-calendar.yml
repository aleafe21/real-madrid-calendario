name: Actualizar calendario

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/index.html"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Actualizar calendario
        run: python scripts/update_calendar.py --update
      - name: Registrar comprobación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/real-madrid.ics site/status.json
          git diff --cached --quiet || git commit -m "chore: actualizar calendario"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
